<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài Bootstrap Grid</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .big-image {
            height: 400px;
        }
        
        .small-image {
            height: 200px;
        }
    </style>
</head>

<body>

    <div class="container mt-4">

        <div class="row gallery">

            <!-- Hình lớn bên trái -->
            <div class="col-md-6 big-image">
                <img src="16._ma_roc_1-0_bo_dao_nha_ronaldo_khoc.webp">
            </div>


            <!-- Phần bên phải -->
            <div class="col-md-6">

                <!-- Hàng trên -->
                <div class="row">

                    <div class="col-6 small-image">
                        <img src="740533728_8649693362.jpeg">
                    </div>

                    <div class="col-6 small-image">
                        <img src="anh-ronaldo-hai.jpg">
                    </div>

                </div>


                <!-- Hàng dưới -->
                <div class="row">

                    <div class="col-4 small-image">
                        <img src="images.jpg">
                    </div>

                    <div class="col-4 small-image">
                        <img src="images1.jpg">
                    </div>

                    <div class="col-4 small-image">
                        <img src="images2.jpg">
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
